[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "resolutive-cosmology"
version = "0.1.0.dev0"
description = "Reproducible framework for testing Resolutive Cosmology against Lambda-CDM."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Marcelo Roldão Matos" }
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/resolutive_cosmology"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["resolutive_cosmology"]
